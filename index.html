<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Filter Produk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>🛍️ Toko Online - Filter Produk</h1>

      <!-- Filter Section -->
      <div class="filter-section">
        <h2>Pilih Kategori</h2>
        <div class="filter-buttons">
          <button class="filter-btn active" onclick="filterProduk('semua')">
            Semua
          </button>
          <button class="filter-btn" onclick="filterProduk('elektronik')">
            Elektronik
          </button>
          <button class="filter-btn" onclick="filterProduk('fashion')">
            Fashion
          </button>
          <button class="filter-btn" onclick="filterProduk('food')">
            Makanan
          </button>
        </div>
      </div>

      <!-- Products Grid -->
      <div class="products-section">
        <h2>Produk (<span id="jumlahProduk">0</span>)</h2>
        <div class="products-grid" id="produksGrid">
          <!-- Produk akan ditampilkan di sini -->
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
