<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Diskon</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>💰 Kalkulator Diskon</h1>

      <div class="card">
        <div class="form-group">
          <label for="harga">Harga Barang (Rp):</label>
          <input
            type="number"
            id="harga"
            placeholder="Contoh: 100000"
            value="100000"
          />
        </div>

        <div class="form-group">
          <label for="diskon">Diskon (%):</label>
          <input
            type="number"
            id="diskon"
            placeholder="Contoh: 10"
            value="10"
          />
        </div>

        <button class="btn" onclick="hitungDiskon()">Hitung Diskon</button>
      </div>

      <div class="result-card">
        <h2>📊 Hasil Perhitungan</h2>
        <div class="result-item">
          <span>Harga Asli:</span>
          <span id="hasilHargaAsli">Rp 0</span>
        </div>
        <div class="result-item">
          <span>Potongan Harga:</span>
          <span id="hasilPotongan">Rp 0</span>
        </div>
        <div class="result-item highlight">
          <span>Harga Akhir:</span>
          <span id="hasilHargaAkhir">Rp 0</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
